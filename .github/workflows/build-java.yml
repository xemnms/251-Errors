name: Build Java Files

on:
  push:
    branches: [ main, develop-* ]
  pull_request:
    branches: [ main, develop-* ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Detect and Build Project
        run: |
          echo "Searching for Maven projects..."

          found_maven=false

          for pom in $(find . -name "pom.xml" -not -path "*/target/*"); do
            found_maven=true
            echo "-----------------------------------"
            echo "Building Maven project: $pom"
            
            mvn -f "$pom" clean install -DskipTests || echo "Failed: $pom"
          done

          if [ "$found_maven" = false ]; then
            echo "No Maven project detected, compiling plain Java"
            mkdir -p bin
            find . -name "*.java" -not -path "*/target/*" > sources.txt
            if [ -s sources.txt ]; then
              javac -d bin @sources.txt
            fi
          else
            echo "Maven projects detected, skipping plain Java compilation"
          fi
