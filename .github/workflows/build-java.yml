name: Build Java Files
on:
  push:
    branches: [ main,develop-* ]
  pull_request:
    branches: [ main, develop-* ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Regular Java Files
        run: |
          set -euo pipefail
          mkdir -p bin

          mapfile -t pom_dirs < <(find . -name "pom.xml" -not -path "*/target/*" -exec dirname {} \;)
          : > sources.txt

          while IFS= read -r java_file; do
            skip=false
            for pom_dir in "${pom_dirs[@]}"; do
              if [[ "$java_file" == "$pom_dir/"* ]]; then
                skip=true
                break
              fi
            done

            if [[ "$skip" == false ]]; then
              printf '%s\n' "$java_file" >> sources.txt
            fi
          done < <(find . -name "*.java" -not -path "*/target/*")

          if [ -s sources.txt ]; then
            javac -d bin @sources.txt
          else
            echo "No non-Maven Java files found."
          fi
      - name: Build Spring Boot Projects
        run: |
          set -euo pipefail
          find . -name "pom.xml" -not -path "*/target/*" | while read pom; do
            dir=$(dirname "$pom")
            echo "Building $dir"
            if [ -x "$dir/mvnw" ]; then
              cd "$dir" && ./mvnw -B -ntp verify && cd $GITHUB_WORKSPACE
            else
              cd "$dir" && mvn -B -ntp verify && cd $GITHUB_WORKSPACE
            fi
          done
