name: Build Java Files

on:
  push:
    branches: [ main, develop-* ]
  pull_request:
    branches: [ main, develop-* ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Detect and Build Project
        run: |
          echo "Checking for Maven projects..."

          if find . -name "pom.xml" | grep -q .; then
            echo "Maven project detected"

            for pom in $(find . -name "pom.xml"); do
              echo "-----------------------------------"
              echo "Building: $pom"
              mvn -f "$pom" clean install -DskipTests
            done

          else
            echo "No Maven project detected, compiling plain Java"
            mkdir -p bin
            find . -name "*.java" -not -path "*/target/*" > sources.txt
            if [ -s sources.txt ]; then
              javac -d bin @sources.txt
            fi
          fi
