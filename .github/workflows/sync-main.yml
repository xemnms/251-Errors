name: Auto Sync Main to Team Branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: [develop-team1, develop-team2, develop-team3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Switch to target branch
        run: git checkout origin/${{ matrix.branch }} -b ${{ matrix.branch }}

      - name: Merge main into target branch
        run: |
          git merge origin/main --no-edit || true

      - name: Push merged changes
        run: git push origin ${{ matrix.branch }}
